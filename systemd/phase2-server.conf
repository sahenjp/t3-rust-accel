# Phase 2: run the Rust-accelerated t3 server build instead of the installed
# versioned runtime. Stage with scripts/apply-phase2.sh; remove with
# scripts/rollback-phase2.sh. Neither script restarts the service.
[Service]
# A blank ExecStart= is required before the replacement ExecStart=.
ExecStart=
# V8 tuning flags are only allowed as direct argv on node, not in NODE_OPTIONS.
# Keep WebAssembly enabled (do NOT use --lite-mode) so undici HTTP/1 fetch works.
ExecStart=/usr/bin/node --optimize-for-size --v8-pool-size=1 --max-old-space-size=192 --max-semi-space-size=1 --memory-reducer-for-small-heaps --expose-gc __HOME__/Projects/t3code/apps/server/dist/bin.mjs serve
Environment=UV_THREADPOOL_SIZE=1
# Product telemetry and relay tracing are opt-in only in this build; keep them
# off unless explicitly enabled. (Upstream default was on.)
Environment=T3CODE_TELEMETRY_ENABLED=false
Environment=T3CODE_OTEL_SDK_DISABLED=true
# The local dist build has no baked-in public cloud config, so T3 Connect
# stays off without these (same public values the release binary ships).
Environment=T3CODE_RELAY_URL=https://relay.t3.codes
Environment=T3CODE_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsudDMuY29kZXMk
Environment=T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=hzxSgY2cH10sDU2r
Environment=T3CODE_STATIC_DIR=__HOME__/Projects/t3-rust-accel/client-latest
Environment=T3_NATIVE_SQLITE_PATH=__HOME__/Projects/t3-rust-accel/crates/t3-native-sqlite/index.mjs
Environment=T3_RUST_BRIDGE_BIN=__HOME__/.local/bin/t3-rust-bridge
Environment=T3_SQLITE_READER_POOL=1
Environment=T3_SQLITE_CACHE_KB=1024
Environment=T3_SQLITE_READER_CACHE_KB=512
Environment=T3_SQLITE_WRITER_CACHE_KB=2048
Environment=T3_SQLITE_TEMP_STORE=FILE
Environment=T3_IDLE_GC_MS=20000
Environment=T3_DISABLE_FILE_TRACE=1
Environment=T3_DEFER_MCP_TOOLS=1
Environment=T3_STATIC_TOOL_LIST=1
Environment=T3_COMPACT_INSTRUCTIONS=1
Environment=T3_COMPACT_TOOL_SCHEMAS=1
Environment=T3_DEDUP_MCP_CONTENT=1
Environment=T3_MCP_RESULT_MAX_CHARS=12000
Environment=T3_COMPACT_HANDOFF=1
Environment=T3_MAKI_TOOLS_BIN=__HOME__/.local/bin/t3-maki-tools
Environment="MALLOC_CONF=narenas:1,dirty_decay_ms:250,muzzy_decay_ms:250,tcache_max:16384"
Environment=LD_PRELOAD=/usr/lib/libjemalloc.so.2
MemoryLow=64M
MemoryHigh=288M

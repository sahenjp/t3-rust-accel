[package]
name = "t3-rust-bridge"
version = "0.1.0"
edition = "2021"
description = "Rust replacement for T3 Code's acp-mcp-bridge / acp-mcp-call commands"
license = "MIT"

[[bin]]
name = "t3-rust-bridge"
path = "src/main.rs"

[lib]
name = "t3_rust_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "net",
    "time",
] }
serde_json = { version = "1", features = ["preserve_order"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
] }
http-body-util = "0.1"
bytes = "1"
http = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
